[project]
name = "taxomesh"
version = "0.1.0"
description = "Flexible taxonomy management for generic items — categories, tags, and multi-parent hierarchies with pluggable storage."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["taxonomy", "categorization", "tags", "dag", "hierarchy", "repository"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Database",
    "Typing :: Typed",
]
dependencies = ["fastapi>=0.110"]

[project.optional-dependencies]
yaml = ["pyyaml>=6.0"]
dev = [
    "fastapi>=0.110",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/ediazpacheco/taxomesh"
Repository = "https://github.com/ediazpacheco/taxomesh"
Issues = "https://github.com/ediazpacheco/taxomesh/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 119

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
addopts = "--cov=taxomesh --cov-report=term-missing"
testpaths = ["tests"]
