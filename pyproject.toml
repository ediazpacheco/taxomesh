[project]
name = "taxomesh"
version = "0.1.0a11"
description = "Flexible taxonomy management for generic items — categories, tags, and multi-parent hierarchies with pluggable storage."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["taxonomy", "categorization", "tags", "dag", "hierarchy", "repository"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Database",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.110",
    "pyyaml>=6.0",
    "rich>=13.0",
    "typer>=0.12",
]

[project.optional-dependencies]
django = [
    "django>=4.2",
]
dev = [
    "fastapi>=0.110",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-django>=4.8",
    "ruff>=0.4",
    "mypy>=1.10",
    "pyyaml>=6.0",
    "types-PyYAML>=6.0",
    "pre-commit>=3.0",
]

[project.scripts]
taxomesh = "taxomesh.adapters.cli.main:app"

[project.urls]
Homepage = "https://github.com/ediazpacheco/taxomesh"
Repository = "https://github.com/ediazpacheco/taxomesh"
Issues = "https://github.com/ediazpacheco/taxomesh/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 119

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PL"]
ignore = []

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["PLR2004"]  # magic-value comparisons are idiomatic in test assertions
"taxomesh/adapters/cli/main.py" = ["PLR0913"]  # CLI functions intentionally have many options
"taxomesh/**/migrations/*.py" = ["E501"]  # Django generates long lines in migrations

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
exclude = ["taxomesh/contrib/django/", "tests/contrib/django/", "tests/django_urls.py"]

[tool.pytest.ini_options]
addopts = "--cov=taxomesh --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests"]
DJANGO_SETTINGS_MODULE = "tests.django_settings"

[tool.coverage.run]
omit = [
    "taxomesh/contrib/django/*",
    "taxomesh/adapters/repositories/django_repository.py",
]

[dependency-groups]
dev = [
    "types-pyyaml>=6.0",
]
