[project]
name = "taxomesh"
version = "0.1.0"
description = "Flexible taxonomy management for generic items — categories, tags, and multi-parent hierarchies with pluggable storage."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["taxonomy", "categorization", "tags", "dag", "hierarchy", "repository"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Database",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
yaml = ["pyyaml>=6.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/ediazpacheco/taxomesh"
Repository = "https://github.com/ediazpacheco/taxomesh"
Issues = "https://github.com/ediazpacheco/taxomesh/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
