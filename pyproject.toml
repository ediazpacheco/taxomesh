[project]
name = "taxomesh"
version = "0.2.0"
description = "taxomesh stores a graph of categories in a YAML file, a JSON file or the Django ORM, and a category can have more than one parent. In Python, you read and delete categories, items and tags with five forms that a dict also has: subscript, get, in, len and del."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
keywords = ["taxonomy", "categorization", "tags", "dag", "hierarchy", "repository"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Database",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "rapidfuzz>=3.0",
]

[project.optional-dependencies]
cli = [
    "typer>=0.12",
    "rich>=13.0",
]
django = [
    "django>=6.0",  # CI runs the matrix against 6.0; any 6.x is supported
]

[project.scripts]
taxomesh = "taxomesh.adapters.cli:run"

[project.urls]
Homepage = "https://github.com/ediazpacheco/taxomesh"
Repository = "https://github.com/ediazpacheco/taxomesh"
Issues = "https://github.com/ediazpacheco/taxomesh/issues"
"Python API" = "https://github.com/ediazpacheco/taxomesh/blob/main/docs/python-api.md"
"HTTP API integration" = "https://github.com/ediazpacheco/taxomesh/blob/main/docs/http-api-integration.md"
"Django integration" = "https://github.com/ediazpacheco/taxomesh/blob/main/docs/django-integration.md"
"Repositories" = "https://github.com/ediazpacheco/taxomesh/blob/main/docs/repositories.md"
"Configuration" = "https://github.com/ediazpacheco/taxomesh/blob/main/docs/configuration.md"
"CLI reference" = "https://github.com/ediazpacheco/taxomesh/blob/main/docs/cli.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py313"
line-length = 119

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PL"]
ignore = []

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["PLR2004"]  # magic-value comparisons are idiomatic in test assertions
"taxomesh/adapters/cli/main.py" = ["PLR0913"]  # CLI functions intentionally have many options
"taxomesh/application/collections/*.py" = ["PLR0913"]  # update and search take one keyword per optional field or filter
"taxomesh/**/migrations/*.py" = ["E501"]  # Django generates long lines in migrations

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "tests.django_settings"

[tool.pytest.ini_options]
addopts = "--cov=taxomesh --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests"]
DJANGO_SETTINGS_MODULE = "tests.django_settings"
markers = [
    "django_db: mark test as requiring Django database access (provided by pytest-django when installed)",
]

[tool.coverage.run]
omit = [
    "taxomesh/contrib/django/*",
    "taxomesh/adapters/repositories/django_repository.py",
]

[dependency-groups]
dev = [
    "django-stubs>=6.0",
    "mypy>=1.19.1",
    "pre-commit>=3.0",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-django>=4.8",
    "ruff>=0.15.2",
    "types-pyyaml>=6.0",
]
