name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  static:
    name: Static checks (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Lint (ruff check)
        run: uv run ruff check .
      - name: Format check (ruff format)
        run: uv run ruff format --check .
      - name: Type check (mypy --strict)
        run: uv run mypy --strict .

  test:
    name: Tests (Python ${{ matrix.python-version }} + Django 6.0)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Tests + coverage
        run: uv run pytest

  wheel:
    name: Wheel consumer smoke (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build wheel
        run: uv build --wheel
      - name: Create clean consumer environment
        run: uv venv --python ${{ matrix.python-version }} /tmp/consumer
      - name: Install built wheel (core)
        run: uv pip install --python /tmp/consumer dist/*.whl
      - name: Smoke-test the core import, one service call, and the CLI without its extra
        run: |
          cd "$(mktemp -d)"
          /tmp/consumer/bin/python - <<'PY'
          from importlib.metadata import version
          from pathlib import Path
          import taxomesh
          from taxomesh import TaxomeshService

          # PEP 561: without this marker, a consumer's mypy ignores every annotation in the package.
          marker = Path(taxomesh.__file__).parent / "py.typed"
          assert marker.is_file(), "py.typed missing from the installed package"

          svc = TaxomeshService()  # no taxomesh.toml: a YAML file under data/ in the working directory
          category = svc.categories.create(name="Smoke")
          assert svc.categories[category.category_id].name == "Smoke"
          print("core wheel OK — taxomesh", version("taxomesh"))
          PY
          # The core install carries no typer or rich, so the command names the extra it needs.
          if /tmp/consumer/bin/taxomesh --help 2> cli-missing.txt; then
            echo "taxomesh --help ran without the cli extra"
            exit 1
          fi
          grep -F "taxomesh[cli]" cli-missing.txt
      - name: Install and verify the CLI extra from the wheel
        run: |
          uv pip install --python /tmp/consumer "$(ls dist/*.whl)[cli]"
          /tmp/consumer/bin/taxomesh --help
      - name: Install and verify the Django extra from the wheel
        run: |
          uv pip install --python /tmp/consumer "$(ls dist/*.whl)[django]"
          /tmp/consumer/bin/python - <<'PY'
          import django

          # The floor that pyproject.toml declares (django>=6.0). An exact minor version here
          # would fail CI at each new minor release of Django that the floor allows.
          assert django.VERSION >= (6, 0), django.VERSION
          import taxomesh  # noqa: F401  core still imports alongside the Django extra
          print("django extra OK — Django", django.get_version())
          PY

  ci:
    name: ci
    needs: [static, test, wheel]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: All quality gates passed
        run: |
          if [[ "${{ needs.static.result }}" != "success" \
             || "${{ needs.test.result }}" != "success" \
             || "${{ needs.wheel.result }}" != "success" ]]; then
            echo "One or more quality gates failed"
            exit 1
          fi
